name: Compiler APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier le SDK Android (déjà installé sur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          cp -r android-icones/* android/app/src/main/res/
          npx cap sync android

      - name: Compiler l'APK
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../elevage-poulets.apk

      - uses: actions/upload-artifact@v7
        with:
          name: elevage-poulets-apk
          path: elevage-poulets.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.${{ github.run_number }}
          name: Élevage Poulets v1.${{ github.run_number }}
          files: elevage-poulets.apk
