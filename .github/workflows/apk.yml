name: Compiler APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier le SDK Android (déjà installé sur GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          cp -r android-icones/* android/app/src/main/res/
          npx cap sync android
          # Toujours signer avec la même clé (debug.keystore du dépôt)
          cat >> android/app/build.gradle <<'FIN'

          android {
              signingConfigs {
                  debug {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          FIN

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../elevage-poulets.apk

      - name: Vérifier la signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs elevage-poulets.apk | tee signature.txt
          grep -qi "5b360f9b7cbf435a0d75269180692435d5e5634f2a8b292592ef58204c67783c" signature.txt || { echo "MAUVAISE SIGNATURE"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: elevage-poulets-apk
          path: elevage-poulets.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.${{ github.run_number }}
          name: Élevage Poulets v1.${{ github.run_number }}
          files: elevage-poulets.apk
