name: Compiler APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          npx cap add android
          cp -r android-icones/* android/app/src/main/res/
          npx cap sync android

      - name: Compiler l'APK
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../elevage-poulets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: elevage-poulets-apk
          path: elevage-poulets.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Élevage Poulets v1.${{ github.run_number }}
          files: elevage-poulets.apk
